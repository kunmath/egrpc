# meta-egrpc — Yocto layer for the egrpc client-only gRPC library.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-egrpc"
BBFILE_PATTERN_meta-egrpc = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-egrpc = "6"

LAYERDEPENDS_meta-egrpc = "core openembedded-layer"
LAYERSERIES_COMPAT_meta-egrpc = "scarthgap"
